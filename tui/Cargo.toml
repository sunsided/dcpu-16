[package]
name = "dcpu16-tui"
description = "A terminal user interface for the dcpu16 DCPU-16 emulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT"
repository = "https://github.com/sunsided/dcpu-16"
readme = "README.md"
keywords = ["dcpu-16", "emulator", "tui", "terminal"]
categories = ["emulators", "command-line-utilities"]

[dependencies]
dcpu16 = { version = "0.2.0", path = ".." }
ratatui = { version = "0.30.2", default-features = false, features = ["std", "layout-cache"] }

# Terminal build.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }

# Browser build (`trunk build`): Ratzilla renders into a WebGL2 canvas.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1.7"
ratzilla = "0.3.1"
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "KeyboardEvent", "Location", "UrlSearchParams", "Window"] }
web-time = "1"
