[package]
name = "dcpu16-tui"
description = "A terminal user interface for the dcpu16 DCPU-16 emulator"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["Markus Mayer <widemeadows@gmail.com>"]
license = "MIT"
repository = "https://github.com/sunsided/dcpu-16"
readme = "README.md"
keywords = ["dcpu-16", "emulator", "tui", "terminal"]
categories = ["emulators", "command-line-utilities"]

[dependencies]
dcpu16 = { version = "0.2.0", path = ".." }
ratatui = "0.30.2"
